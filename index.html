<!DOCTYPE html>
<html lang="en">
<head>

    <title>My personal profile - Introduction to HTML</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;

            max-width: 150px;

        }
        ul, ol{
            margin-left: 20px;
        }

</head>
<body>

<img src="https://randomuser.me/api/portraits/men/59.jpg" alt="profile photo">

<ul>
    <li>Coding</li>

</ul>

</html>
